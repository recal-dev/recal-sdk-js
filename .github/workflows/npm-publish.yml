name: Publish to npm

# A published GitHub Release is the only trigger, deliberately. `gh release create v1.2.0`
# pushes the tag and publishes the release, so a `push: tags: ['v*']` trigger alongside this
# one fired twice for every release — two concurrent jobs racing to `npm publish` the same
# version, one of which loses with EPUBLISHCONFLICT. Releasing by bare tag no longer
# publishes anything, which is the intended flow: the Release is the artifact people read.
on:
  release:
    types: [published]

permissions:
    id-token: write
    contents: read

# Publishing a version is not repeatable, so never let two runs overlap, and never cancel
# one in flight — a cancelled job mid-`npm publish` is worse than a queued one.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    secrets:
      RECAL_TOKEN: ${{ secrets.RECAL_TOKEN }}
      RECAL_URL: ${{ secrets.RECAL_URL }}
      TEST_GOOGLE_ACCESS_TOKEN: ${{ secrets.TEST_GOOGLE_ACCESS_TOKEN }}
      TEST_GOOGLE_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_REFRESH_TOKEN }}

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing exchanges the job's OIDC token for a short-lived npm
      # credential, so no NPM_TOKEN is needed. It requires npm >= 11.5.1, which is
      # newer than the version bundled with any current Node release.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish
