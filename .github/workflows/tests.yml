name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_call:
        secrets:
            RECAL_TOKEN:
                required: true
            RECAL_URL:
                required: true
            TEST_GOOGLE_ACCESS_TOKEN:
                required: false
            TEST_GOOGLE_REFRESH_TOKEN:
                required: false

# Per-ref, because a constant group puts every run in the repo into one queue. That is how
# v1.0.1's test job died: its Release and v1.1.0's were created seconds apart, the newer run
# joined the same queue, and GitHub cancelled the older *pending* one — `cancel-in-progress:
# false` only protects a run already in flight. The cancelled test job then skipped the
# publish job that needs it. Keyed on the ref, independent releases queue independently.
concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: false

jobs:
    test:
        name: Test Suite
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run linter
              run: bun run lint

            - name: Run type check
              run: bun run typecheck

            - name: Run biome checks
              run: bun run check

            - name: Run tests
              run: bun run test
              env:
                RECAL_TOKEN: ${{ secrets.RECAL_TOKEN }}
                RECAL_URL: ${{ secrets.RECAL_URL }}
                GOOGLE_ACCESS_TOKEN: ${{ secrets.TEST_GOOGLE_ACCESS_TOKEN }}
                GOOGLE_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_REFRESH_TOKEN }}

            - name: Build package
              run: bun run build
